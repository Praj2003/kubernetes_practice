apiVersion: apps/v1
kind: Deployment
metadata:
  name: expressApplication-deployment
  labels:
    app: expressApp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expressApp
  template:
    metadata:
      name: expressWebApp
      labels:
        app: expressApp
    spec:
      containers:
        - name: mongo-express
          image: mongo-express
          ports:
           - containerPort: 8081
          env:
           - name: ME_CONFIG_MONGODB_ADMINUSERNAME
             valueFrom:
              secretKeyRef:
                name: mongo-secret
                key: MONGO_INITDB_ROOT_USERNAME

           - name: ME_CONFIG_MONGODB_ADMINPASSWORD
             valueFrom:
               secretKeyRef:
                 name: mongo-secret
                 key: MONGO_INITDB_ROOT_PASSWORD

           - name: ME_CONFIG_MONGODB_SERVER
             valueFrom:
              configMapKeyRef:
               name: mongo-config-service
               key: mongo-url
             